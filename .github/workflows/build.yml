name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root deps
        run: npm ci

      # App deps are installed BEFORE the root test step on purpose:
      # tests/agent-manager.test.ts imports through app/src/main/agent.ts →
      # secure-config.ts → "electron", and electron lives in
      # app/node_modules. Without app/ deps the root vitest run fails with
      # ERR_MODULE_NOT_FOUND on electron.
      - name: Install app deps
        working-directory: app
        run: npm ci

      # Runs after both installs so it can read app/package-lock.json. Cheap, and
      # it catches a class of drift the typecheck cannot see: app/ resolving a pi
      # package to a different version than the root tree, which duplicates the
      # module and splits its state at runtime.
      - name: Check version lockstep
        run: npm run check:versions

      - name: Typecheck (root)
        run: npm run typecheck

      # Vendored Foundry reference is generated by scripts/sync-foundry-skills.mjs.
      # Offline hash check -- catches hand-edits and a moved pin that wasn't re-synced.
      - name: Check vendored Foundry skills
        run: npm run check:foundry-skills

      - name: Typecheck (app)
        working-directory: app
        run: npx tsc --noEmit

      - name: Test (root)
        run: npm test

      # Packs the tarball and installs it WITHOUT the lockfile, so the runtime
      # deps resolve the way a user's `npm i -g @galaxyproject/loom` resolves
      # them rather than the way our pinned tree does. That gap is not
      # theoretical: #395 was a published dependency adding an `exports` map,
      # which every lockfile-pinned check here sailed past and every fresh
      # install hit on the first line of startup.
      #
      # Deliberately not hermetic -- it reaches the network and can go red
      # because a dependency published something broken, not because this PR
      # did. That is the point of the step; read a failure here as "a user
      # installing right now would hit this too".
      - name: Smoke test packed tarball
        run: npm run smoke:pack

      - name: Package Electron app
        working-directory: app
        run: npx electron-forge package
