name: browser

# browser/ is its own npm workspace (the core, olit and the bare test flavor, with their own
# lockfile, lint and test scripts) and is not part of the root build, so it gets its own
# workflow. It starts on every PR so the "browser" check always reports and can be required,
# and runs the suite when browser/ changes, or Orbit's chat UI and the shared contracts it
# imports from there.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
      # Orbit's chat UI and the shared contracts are part of what the browser builds, so a change
      # there runs the browser suite as well as Orbit's.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            browser:
              - "browser/**"
              - "app/src/renderer/**"
              - "shared/**"
              # The conformance test (core/src/agent/pi-host.orbit.test.ts) boots Orbit's brain.
              - "extensions/**"
              - ".github/workflows/browser.yml"

  test:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            browser/package-lock.json
            package-lock.json

      # Node 22 ships npm 10.9, whose peer resolution crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on a cold install.
      - name: Use npm 11
        run: npm install -g npm@11

      # black and ruff, for `npm run lint:scripts`.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: browser/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # pi-coding-agent's types for the pi-host shim's type-only import, and Orbit's runtime
      # dependencies for the conformance test that boots extensions/loom on it.
      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx --no-install playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Firefox and WebKit too: e2e/run-all.sh drives python-isolation in both.
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      # Unit tests and the typecheck read the skills corpus that the build fetches.
      - name: Build
        run: npm run build

      # The agents repo drives dist/session.mjs, and its build crosses into the core's package
      # exports; --describe loads the bundle and resolves the flavor and the core from it.
      - name: Build the Node session bundle
        run: npm run build:session

      - name: Smoke the session bundle
        run: node dist/session.mjs --describe --root . > /dev/null

      - name: Test
        run: npm test

      - name: Keep e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-logs
          path: /tmp/olit-e2e-*.log
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require: green when the suite passed or had nothing to run, red otherwise.
  browser:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Browser suite
        run: |
          case "${{ needs.changes.result }}/${{ needs.test.result }}" in
            success/success|success/skipped) echo "ok" ;;
            *) echo "changes: ${{ needs.changes.result }}, test: ${{ needs.test.result }}"; exit 1 ;;
          esac
